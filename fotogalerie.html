  <header class="hlavicka">
    <a class="logo" href="index.html">Filip Löbel</a>
    <nav class="menu">
      <a href="index.html#o-mne">O mně</a>
      <div class="menu-polozka">
        <a href="fotogalerie.html" class="aktivni">Fotogalerie</a>
        <div class="podmenu">
          <a href="fotogalerie.html#portrety">Portréty</a>
          <a href="fotogalerie.html#mazlicci">Mazlíčci</a>

      <a href="index.html#cenik">Ceník</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </header>

  <main>

    <section class="kontakt-uvod">
      <h1>Fotogalerie</h1>
      <p>Výběr z mé tvorby.</p>
      <nav class="kategorie-menu">
        <a href="#portrety">Portréty</a>
        <a href="#mazlicci">Mazlíčci</a>
        <a href="#svatby">Svatby</a>
        <a href="#krajiny">Krajiny</a>
      </nav>
    </section>

    <section class="kategorie" id="portrety">
      <h2>Portréty</h2>
      <div class="galerie galerie-3">
        <figure><img src="img/portret-1.jpg" alt="Muž stojící u mlžného horského jezera" loading="lazy"></figure>
        <figure><img src="img/portret-2.jpg" alt="Portrét" loading="lazy"></figure>
      </div>
    </section>

    <section class="kategorie" id="mazlicci">
      <h2>Mazlíčci</h2>
      <div class="galerie galerie-3">
        <figure><img src="img/mazlicek-1.jpg" alt="Pes při pohledu shora v podzimní trávě" loading="lazy"></figure>
        <figure><img src="img/mazlicek-2.jpg" alt="Fotografie mazlíčka" loading="lazy"></figure>
      </div>
    </section>

    <section class="kategorie" id="svatby">
      <h2>Svatby</h2>
      <div class="galerie galerie-3">
        <figure><img src="img/svatba-1.jpg" alt="Svatební fotografie" loading="lazy"></figure>
        <figure><img src="img/svatba-2.jpg" alt="Svatební fotografie" loading="lazy"></figure>
      </div>
    </section>

    <section class="kategorie" id="krajiny">
      <h2>Krajiny</h2>
      <div class="galerie galerie-3">
        <figure><img src="img/krajina-1.jpg" alt="Krajina" loading="lazy"></figure>
        <figure><img src="img/krajina-2.jpg" alt="Krajina" loading="lazy"></figure>
      </div>
    </section>
